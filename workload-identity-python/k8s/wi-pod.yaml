# Placeholders in ${...} form are filled in by deploy.sh.
apiVersion: v1
kind: Pod
metadata:
  name: wi-kv-test
  namespace: default
  labels:
    # Tells the workload identity webhook to inject the federated token and AZURE_* variables.
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: wi-demo-sa
  containers:
    - name: wi-kv-test
      image: "${IMAGE}"
      imagePullPolicy: Always
      env:
        - name: KEY_VAULT_URL
          value: "${KEY_VAULT_URL}"
        - name: SECRET_NAME
          value: "${SECRET_NAME}"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
  nodeSelector:
    kubernetes.io/os: linux
